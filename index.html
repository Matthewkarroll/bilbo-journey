<!DOCTYPE html>
<html>
<head>
    <title>Bilbo's Journey</title>
    <!-- Load Leaflet CSS for the map -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { font-family: sans-serif; background: #1a1a1a; color: white; padding: 20px; }
        #map { height: 600px; width: 100%; border-radius: 10px; margin-top: 20px; }
        .controls { background: #2d2d2d; padding: 20px; border-radius: 10px; margin-top: 20px; }
        button { padding: 10px 20px; background: #4CAF50; color: white; border: none; cursor: pointer; border-radius: 5px; }
        input { padding: 10px; width: 100px; }
        #status { margin-top: 20px; padding: 15px; background: #333; border-radius: 5px; }
        
        #stats-card {
            background: #222;
            padding: 15px 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            border: 1px solid #444;
        }
        #checklist-container {
            background: #2d2d2d;
            padding: 20px;
            border-radius: 10px;
            margin-top: 20px;
            border: 1px solid #444;
        }
        .checklist-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 10px;
        }
        .checklist-grid label {
            display: flex;
            align-items: center;
            gap: 10px;
            color: #ddd;
            font-size: 14px;
            cursor: pointer;
            padding: 5px;
            border-radius: 5px;
            transition: background 0.2s;
        }
        .checklist-grid label:hover {
            background: #3d3d3d;
        }
        .checklist-grid input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
            accent-color: #ffc107; /* Makes the check box yellow */
        }
        .checklist-grid input[type="checkbox"]:checked + span {
            text-decoration: line-through;
            color: #888;
        }
    </style>
</head>
<body>
    <h1>🧙‍♂️ Bilbo's Journey</h1>

    <!-- Character Level Card -->
    <div id="stats-card">
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <div>
                <h2 style="margin: 0; color: #ffc107;">⚔️ Level <span id="level-display">1</span></h2>
                <p style="margin: 5px 0 0 0; color: #aaa;">Sir Walks-a-lot</p>
            </div>
            <div style="text-align: right;">
                <p style="margin: 0; font-size: 14px; color: #aaa;">Next Level</p>
                <p style="margin: 0; font-size: 18px; font-weight: bold; color: #fff;">
                    <span id="xp-display">0</span> / <span id="next-level-xp">100</span> XP
                </p>
            </div>
        </div>
        
        <!-- XP Progress Bar -->
        <div style="width: 100%; background: #333; height: 15px; border-radius: 10px; margin-top: 10px; overflow: hidden;">
            <div id="xp-bar-fill" style="height: 100%; width: 0%; background: linear-gradient(90deg, #f7971e, #ffd200); border-radius: 10px; transition: width 0.3s ease;"></div>
        </div>
    </div>
    
    <div class="controls">
        <label>Miles to walk: <input type="number" id="milesInput" value="1"></label>
        <button onclick="walk()">🚶 Walk!</button>
        <button id="resetBtn" onclick="resetJourney()" style="background: #d9534f;">Reset</button>
        <button id="autoWalkBtn" onclick="toggleAutoWalk()" style="background: #ffc107; color: black;">▶️ Auto-Walk</button>
    </div>

    <div id="status"><span id="statusText">Current Location: Bag End (0 miles)</span></div>

    <div id="map"></div>

    <!-- Checklist Section -->
    <div id="checklist-container">
        <h2 style="color: #ffc107; margin-top: 20px;">🗺️ The Journey Log</h2>
        <div class="checklist-grid">
            <label><input type="checkbox" class="stop-check" value="Bag End"> 🏡 Bag End</label>
            <label><input type="checkbox" class="stop-check" value="Caught by trolls"> 🐉 Caught by Trolls</label>
            <label><input type="checkbox" class="stop-check" value="Rivendell"> 🍃 Rivendell</label>
            <label><input type="checkbox" class="stop-check" value="Misty Mountains (Goblins)"> ⛰️ Misty Mountains (Goblins)</label>
            <label><input type="checkbox" class="stop-check" value="Gollum & The Ring"> 💍 Gollum & The Ring</label>
            <label><input type="checkbox" class="stop-check" value="Rejoin Gandalf & Dwarves"> 🧙 Rejoin Gandalf & Dwarves</label>
            <label><input type="checkbox" class="stop-check" value="Beorn's Hall"> 🐻 Beorn's Hall</label>
            <label><input type="checkbox" class="stop-check" value="Mirkwood (Gandalf Leaves)"> 🌲 Mirkwood (Gandalf Leaves)</label>
            <label><input type="checkbox" class="stop-check" value="Giant Spiders & Wood Elves"> 🕷️ Giant Spiders & Wood Elves</label>
            <label><input type="checkbox" class="stop-check" value="Barrel Escape"> 🛢️ Barrel Escape</label>
            <label><input type="checkbox" class="stop-check" value="Lake Town"> 🏘️ Lake Town</label>
            <label><input type="checkbox" class="stop-check" value="The Lonely Mountain"> 🐉 The Lonely Mountain</label>
        </div>
    </div>

    <!-- Load Leaflet JS for the map -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <!-- Load your custom script -->
    <script>const MAP_IMAGE = "middle-earth.jpg";</script>
</body>
</html>
